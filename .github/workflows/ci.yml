name: Rentora CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/browse-experience]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build React app
        run: npm run build
      - name: Check payment functions syntax
        run: node --check functions/index.js
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
