name: Deploy Rentora Firebase Functions

on:
  workflow_dispatch:
    inputs:
      firebase_project_id:
        description: Exact Firebase project ID to deploy to
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY to continue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: firebase-deploy
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate project allowlist and files
        env:
          PROJECT_ID: ${{ inputs.firebase_project_id }}
          ALLOWED_PROJECTS: ${{ vars.FIREBASE_ALLOWED_PROJECTS }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$ALLOWED_PROJECTS"
          case ",$ALLOWED_PROJECTS," in
            *",$PROJECT_ID,"*) echo "Approved Firebase project: $PROJECT_ID" ;;
            *) echo "Project is not in FIREBASE_ALLOWED_PROJECTS." >&2; exit 1 ;;
          esac
          test -f firebase.json
          test -f functions/package.json
          test -f functions/index.js
          node --check functions/index.js

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.firebase_project_id }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and function dependencies
        run: |
          npm install --global firebase-tools
          npm install --prefix functions

      - name: Deploy functions only
        env:
          PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive
